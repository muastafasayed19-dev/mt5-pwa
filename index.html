<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MetaTrader 5</title>
  <style>
    :root {
      --bg-black: #000000;
      --bg-surface: #121212;
      --bg-drawer: #0c0c0c;
      --bg-pill: #232325;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --blue-profit: #2b7de9;
      --red-loss: #e5484d;
      --border-color: #1c1c1e;
      --exness-yellow: #ffcf01;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-primary);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top App Bar */
    .topbar {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-black);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .title-sub {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    .profit-pos { color: var(--blue-profit); }
    .profit-neg { color: var(--red-loss); }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    /* Main Content Area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 16px;
    }

    /* Account Summary Rows */
    .summary-section {
      padding: 6px 16px 12px 16px;
    }

    .summary-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14.5px;
    }

    .summary-label {
      color: var(--text-primary);
      font-weight: 500;
      white-space: nowrap;
    }

    .summary-dots {
      flex: 1;
      border-bottom: 1.5px dotted #2c2c2e;
      margin: 0 8px;
    }

    .summary-value {
      color: var(--text-primary);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Positions Header */
    .section-header {
      background-color: #161618;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
    }

    /* Position Item */
    .position-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pos-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pos-top {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .pos-type-buy { color: var(--blue-profit); font-weight: 500; }
    .pos-type-sell { color: var(--red-loss); font-weight: 500; }

    .pos-prices {
      font-size: 13.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .pos-right {
      font-size: 15.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Bottom Navigation */
    .bottom-nav {
      height: 62px;
      background-color: var(--bg-black);
      border-top: 1px solid #161618;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 0 8px 0;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      flex: 1;
      position: relative;
    }

    .nav-item.active {
      color: var(--text-primary);
    }

    .nav-badge-pill {
      background-color: #1c2738;
      color: var(--blue-profit);
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .nav-badge-pill.neg {
      background-color: #361c1e;
      color: var(--red-loss);
    }

    .msg-badge {
      position: absolute;
      top: -2px;
      right: 26%;
      background-color: #d9534f;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Side Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.65);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 82%;
      max-width: 330px;
      background-color: var(--bg-drawer);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 8px 8px 20px 8px;
    }

    .broker-logo {
      width: 44px;
      height: 44px;
      background-color: var(--exness-yellow);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }

    .account-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .acc-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .acc-server {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .manage-link {
      color: #4a90e2;
      font-size: 14.5px;
      margin-top: 8px;
      cursor: pointer;
    }

    .drawer-menu {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 24px;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .drawer-item.active {
      background-color: var(--bg-pill);
    }

    .drawer-item-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .mail-badge {
      background-color: #d9534f;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
    }

    .ads-pill {
      border: 1px solid #3a4a63;
      color: #5b8ad6;
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 12px;
    }

    /* Settings Modal */
    .modal {
      position: fixed;
      inset: 0;
      background-color: var(--bg-black);
      z-index: 120;
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      user-select: text;
    }

    .save-btn {
      background-color: var(--blue-profit);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->

    <div class="topbar-left">
      <button class="menu-btn" onclick="toggleDrawer(true)">

  <!-- Main Content -->
  <main class="content" id="mainContent">

        <span class="summary-label">Equity:</span>

      <div class="summary-row" id="rowMargin">
        <span class="summary-label">Margin:</span>

      <div class="summary-row">
        <span class="summary-label">Free margin:</span>
        <span class="summary-dots"></span>

    <div class="section-header" id="positionsHeader">
      <span>Positions</span>

    <div id="positionsList">

  </main>

      <div class="broker-logo">exness</div>
      <div class="account-info">
        <div class="acc-name" id="drawerAccName">Client</div>
        <div class="acc-server" id="drawerAccServer">43233923 - Exness-MT5Real2</div>
        <div class="manage-link" onclick="openSettings()">Manage accounts</div>
      </div>

  <!-- Custom Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-header">
      <h3>Account & Sync Settings</h3>
      <button class="icon-btn" onclick="closeSettings()">✕</button>
    </div>

    <div class="form-group">
      <label>Account Name (الاسم الظاهر في القائمة)</label>
      <input type="text" id="inpAccName" placeholder="Client" />
    </div>

    <div class="form-group">
      <label>Account Number & Server (رقم الحساب والسيرفر)</label>
      <input type="text" id="inpAccServer" placeholder="43233923 - Exness-MT5Real2" />
    </div>

    <div class="form-group">
      <label>Firebase Database URL (اختياري للربط المباشر بالكمبيوتر)</label>
      <input type="text" id="inpFirebaseUrl" placeholder="https://your-project.firebaseio.com" />
    </div>

    <button class="save-btn" onclick="saveSettings()">Save Changes</button>
  </div>

  <script>
    // Default Configuration
    const defaultConfig = {
      accName: "Client",
      accServer: "43233923 - Exness-MT5Real2",
      firebaseUrl: ""
    };

    let config = JSON.parse(localStorage.getItem("mt5_custom_config")) || defaultConfig;

    function applyConfig() {
      document.getElementById("drawerAccName").textContent = config.accName;
      document.getElementById("drawerAccServer").textContent = config.accServer;
      document.getElementById("inpAccName").value = config.accName;
      document.getElementById("inpAccServer").value = config.accServer;
      document.getElementById("inpFirebaseUrl").value = config.firebaseUrl;
    }

    function toggleDrawer(open) {
      document.getElementById("sideDrawer").classList.toggle("open", open);
      document.getElementById("drawerOverlay").classList.toggle("open", open);
    }

    function openSettings() {
      toggleDrawer(false);
      document.getElementById("settingsModal").classList.add("open");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("open");
    }

    function saveSettings() {
      config.accName = document.getElementById("inpAccName").value.trim() || "Client";
      config.accServer = document.getElementById("inpAccServer").value.trim() || "43233923 - Exness-MT5Real2";
      config.firebaseUrl = document.getElementById("inpFirebaseUrl").value.trim().replace(/\/$/, "");
      localStorage.setItem("mt5_custom_config", JSON.stringify(config));
      applyConfig();
      closeSettings();
    }

    function formatNum(num) {
      return Number(num || 0).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).replace(/,/g, " ");
    }

    function renderData(data) {
      const balance = Number(data.balance || 0);
      const equity = Number(data.equity || 0);
      const margin = Number(data.margin || 0);
      const freeMargin = Number(data.freeMargin || 0);
      const marginLevel = Number(data.marginLevel || 0);
      const profit = equity - balance;

      document.getElementById("valBalance").textContent = formatNum(balance);
      document.getElementById("valEquity").textContent = formatNum(equity);
      document.getElementById("valMargin").textContent = formatNum(margin);
      document.getElementById("valFreeMargin").textContent = formatNum(freeMargin);
      document.getElementById("valMarginLevel").textContent = formatNum(marginLevel);

      const topProfit = document.getElementById("topProfit");
      const navPill = document.getElementById("navProfitPill");
      topProfit.textContent = `${profit.toFixed(2)} USD`;
      navPill.textContent = profit.toFixed(2);

      if (profit < 0) {
        topProfit.className = "title-sub profit-neg";
        navPill.className = "nav-badge-pill neg";
      } else {
        topProfit.className = "title-sub profit-pos";
        navPill.className = "nav-badge-pill";
      }

      const positions = data.positions || [];
      const listEl = document.getElementById("positionsList");
      const posHeader = document.getElementById("positionsHeader");
      const rowMargin = document.getElementById("rowMargin");
      const rowMarginLevel = document.getElementById("rowMarginLevel");

      if (positions.length === 0) {
        posHeader.style.display = "none";
        rowMargin.style.display = "none";
        rowMarginLevel.style.display = "none";
        listEl.innerHTML = "";
      } else {
        posHeader.style.display = "flex";
        rowMargin.style.display = "flex";
        rowMarginLevel.style.display = "flex";
        listEl.innerHTML = positions.map(p => {
          const isBuy = p.type.toLowerCase() === "buy";
          const isPos = Number(p.profit) >= 0;
          return `
            <div class="position-item">
              <div class="pos-left">
                <div class="pos-top">
                  ${p.symbol}, <span class="${isBuy ? 'pos-type-buy' : 'pos-type-sell'}">${p.type} ${p.volume}</span>
                </div>
                <div class="pos-prices">${p.openPrice} → ${p.currentPrice}</div>
              </div>
              <div class="pos-right ${isPos ? 'profit-pos' : 'profit-neg'}">
                ${Number(p.profit).toFixed(2)}
              </div>
            </div>
          `;
        }).join("");
      }
    }

    // Live Polling Loop
    async function fetchLiveData() {
      if (!config.firebaseUrl) return;
      try {
        const res = await fetch(`${config.firebaseUrl}/mt5data.json`);
        if (res.ok) {
          const data = await res.json();
          if (data) renderData(data);
        }
      } catch (e) {
        // Silent retry
      }
    }

    applyConfig();
    // Initial sample preview (0.00 state like your screenshot)
    renderData({ balance: 0, equity: 0, margin: 0, freeMargin: 0, marginLevel: 0, positions: [] });
    setInterval(fetchLiveData, 1000);
  </script>
</body>
</html>
